name: test

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest (hash-pinned)
        run: python3 -m pip install --require-hashes --no-deps -r .github/test-requirements.txt
      # The guard starts only now: setup-python may download Python and upgrade pip.
      - name: Enable offline guard
        shell: bash
        run: |
          {
            echo "SKILLS_OFFLINE=1"
            echo "PYTHONPATH=$GITHUB_WORKSPACE/tests/offline"
            echo "SKILLS_OFFLINE_LOG=$RUNNER_TEMP/offline-net.log"
          } >> "$GITHUB_ENV"
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Run security guardrails
        env:
          SKILLS_OFFLINE_LOG: ""
        run: python3 -m pytest tests/security -v
      - name: Run explain-changes tests
        run: python3 -m pytest tests/explain-changes -v
      - name: Run teach-me tests
        run: python3 -m pytest tests/teach-me -v
      - name: Fail if tests tried to reach the network
        shell: bash
        run: test ! -s "$SKILLS_OFFLINE_LOG" || { cat "$SKILLS_OFFLINE_LOG"; exit 1; }

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install scanners (hash-pinned)
        run: python3 -m pip install --require-hashes --no-deps -r .github/ci-requirements.txt
      - name: Run Bandit
        run: bandit -r skills -q
      - name: Audit GitHub config with zizmor
        run: zizmor --format=github .github
        env:
          GH_TOKEN: ${{ github.token }}
