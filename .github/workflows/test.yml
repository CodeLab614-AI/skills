name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    env:
      SKILLS_OFFLINE: "1"
      PYTHONPATH: ${{ github.workspace }}/tests/offline
    steps:
      - name: Prepare offline log
        shell: bash
        run: echo "SKILLS_OFFLINE_LOG=$RUNNER_TEMP/offline-net.log" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Run security guardrails
        env:
          SKILLS_OFFLINE_LOG: ""
        run: python3 -m unittest discover -s tests/security -v
      - name: Run explain-changes tests
        run: python3 -m unittest discover -s tests/explain-changes -v
      - name: Run teach-me tests
        run: python3 -m unittest discover -s tests/teach-me -v
      - name: Fail if tests tried to reach the network
        shell: bash
        run: test ! -s "$SKILLS_OFFLINE_LOG" || { cat "$SKILLS_OFFLINE_LOG"; exit 1; }

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Bandit (hash-pinned)
        run: python3 -m pip install --require-hashes --no-deps -r .github/ci-requirements.txt
      - name: Run Bandit
        run: bandit -r skills -q
